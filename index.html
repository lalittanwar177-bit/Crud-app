<!DOCTYPE html>
<html>
<head>
    <title>Neon CRUD App</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI';
            background: #0f2027;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
        }

        .container {
            width: 85%;
            margin: 40px auto;
        }

        h2 {
            text-align: center;
        }

        .name-tag {
            display: inline-block;
            margin-top: 10px;
            background: #00ffcc;
            color: black;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .form-box {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px #00ffcc;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: #222;
            color: white;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .add { background: #00ffcc; color: black; }
        .update { background: #f9ca24; color: black; }
        .view { background: #6c5ce7; color: white; }
        .edit { background: #00cec9; color: black; }
        .delete { background: #ff4757; color: white; }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 10px white;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
            background: #111;
            box-shadow: 0 0 15px #00ffcc;
        }

        th {
            background: #00ffcc;
            color: black;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #1a1a1a;
        }

        tr:hover {
            background: #333;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #111;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px #00ffcc;
        }

    </style>
</head>

<body>

<div class="container">
    <h2>
        🚀  CRUD Dashboard <br>
        <span class="name-tag">👤 Lalit | Roll No: 24CA2024</span>
    </h2>

    <div class="form-box">
        <input type="number" id="id" placeholder="ID">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="address" placeholder="Address">

        <button class="add" onclick="addUser()">Add</button>
        <button class="update" onclick="updateUser()">Update</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Address</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3>User Details</h3>
        <p id="viewData"></p>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>

const idField = document.getElementById("id");
const nameField = document.getElementById("name");
const addressField = document.getElementById("address");

function getUsers() {
    return JSON.parse(localStorage.getItem("users")) || [];
}

function saveUsers(users) {
    localStorage.setItem("users", JSON.stringify(users));
}

function displayUsers() {
    const users = getUsers();
    const table = document.getElementById("data");
    table.innerHTML = "";

    users.forEach(user => {
        table.innerHTML += `
        <tr>
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.address}</td>
            <td>
                <button class="view" onclick="viewUser(${user.id})">View</button>
                <button class="edit" onclick="editUser(${user.id})">Edit</button>
                <button class="delete" onclick="deleteUser(${user.id})">Delete</button>
            </td>
        </tr>
        `;
    });
}

// VIEW
function viewUser(id) {
    const users = getUsers();
    const user = users.find(u => u.id == id);

    document.getElementById("viewData").innerHTML = `
        ID: ${user.id} <br>
        Name: ${user.name} <br>
        Address: ${user.address}
    `;

    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

// ADD
function addUser() {
    const id = idField.value;
    const name = nameField.value;
    const address = addressField.value;

    if (!id || !name || !address) {
        alert("Fill all fields!");
        return;
    }

    let users = getUsers();
    users.push({ id, name, address });

    saveUsers(users);
    displayUsers();
}

// EDIT
function editUser(id) {
    const users = getUsers();
    const user = users.find(u => u.id == id);

    idField.value = user.id;
    nameField.value = user.name;
    addressField.value = user.address;
}

// UPDATE
function updateUser() {
    const id = idField.value;
    const name = nameField.value;
    const address = addressField.value;

    let users = getUsers();

    users = users.map(u =>
        u.id == id ? { id, name, address } : u
    );

    saveUsers(users);
    displayUsers();
}

// DELETE
function deleteUser(id) {
    let users = getUsers();

    users = users.filter(u => u.id != id);

    saveUsers(users);
    displayUsers();
}

displayUsers();

</script>

</body>
</html>
